<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      /* v1.9.2 "Obsidian Slate" — tokens từ Gemini max-tier spec (16.5k chars) */
      --bg: #090b0e;                 /* canvas */
      --card: #101318;               /* surface-1: sections, tab track */
      --card2: #0c0e12;              /* inset: inputs, progress track */
      --surface-2: #161a21;          /* platform cards, active tab thumb */
      --surface-hover: #1c212b;
      --line: rgba(255, 255, 255, 0.06);
      --line2: rgba(255, 255, 255, 0.18);
      --edge: rgba(255, 255, 255, 0.14); /* top specular highlight */
      --txt: #f0f3f7;                /* primary (titles, names) */
      --dim: #9aa3b2;                /* secondary */
      --faint: #798394;              /* tertiary — 5.1:1 on surface-1 */
      --ok: #22c55e; --ok-bg: rgba(34, 197, 94, .12); --ok-bd: rgba(34, 197, 94, .28);
      --warn: #f59e0b; --warn-bg: rgba(245, 158, 11, .12); --warn-bd: rgba(245, 158, 11, .32);
      --bad: #ef4444; --bad-bg: rgba(239, 68, 68, .12); --bad-bd: rgba(239, 68, 68, .35);
      --bad-text: #fca5a5;
      --info: #38bdf8;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --dur-fast: 120ms; --dur-med: 200ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, .45), inset 0 1px 0 var(--edge);
      --shadow-thumb: 0 1px 3px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .16);
    }
    * { box-sizing: border-box; }
    body {
      font: 13px/1.5 var(--sans); width: 372px; margin: 0; padding: 0 0 12px;
      background: var(--bg); color: var(--txt); position: relative; overflow: hidden;
    }
    body.online::before {
      content: ""; position: absolute; top: -60px; left: -60px; width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.06), transparent 70%); pointer-events: none;
    }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ── top bar ─────────────────────────── */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }
    .wordmark { font-weight: 700; font-size: 13.5px; letter-spacing: .2px; }
    .wordmark em { color: var(--ok); font-style: normal; }
    .statuspill {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim);
      border: 1px solid var(--line); background: var(--card); border-radius: 9999px; padding: 3px 10px;
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }
    .statuspill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    body.online .statuspill .led { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 2.2s infinite; }
    body.offline .statuspill .led { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
    /* v1.9 (blueprint Gemini): 3 trạng thái server — Online / No Token (401) / Offline */
    .statuspill[data-state="online"] { color: var(--ok); border-color: rgba(16, 185, 129, .4); }
    .statuspill[data-state="no-auth"] { color: var(--warn); border-color: rgba(245, 158, 11, .5); cursor: pointer; }
    .statuspill[data-state="no-auth"] .led { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .statuspill[data-state="offline"] { color: var(--bad); border-color: rgba(239, 68, 68, .4); }
    @keyframes pulse { 50% { opacity: .6; } }

    /* ── tabs — segmented control (spec: surface thumb thay neon green) ── */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin: 0 12px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
    .tab { flex: 1; font: 600 12px var(--sans); color: var(--dim); background: transparent; border: 0; border-radius: 6px; padding: 6px 0; cursor: pointer; transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
    .tab:hover { color: var(--txt); }
    .tab.active { color: var(--txt); background: var(--surface-2); box-shadow: var(--shadow-thumb); }
    .tab .gear { font-size: 13px; }

    .page { padding: 0; }
    .hidden { display: none; }

    /* ── cards ───────────────────────────── */
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; margin: 0 12px 10px; box-shadow: var(--shadow-card);
    }
    .cardhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .ct { font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; }
    .badge { font: 500 10.5px var(--sans); border-radius: 9999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--dim); }
    .badge.ok { color: var(--ok); border-color: var(--ok-bd); background: var(--ok-bg); }
    .badge.warn { color: var(--warn); border-color: var(--warn-bd); background: var(--warn-bg); }
    .badge.bad { color: var(--bad-text); border-color: var(--bad-bd); background: rgba(239, 68, 68, .2); }

    .barrow { margin: 7px 0 3px; }
    .barrow .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-bottom: 4px; }
    .barrow .lbl b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; font-weight: 500; color: var(--txt); }
    .track {
      position: relative; height: 4px; background: var(--card2); border-radius: 9999px; overflow: hidden;
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, .6);
    }
    /* spec "wow": vạch quartile 10/20/30/40 — 6 dòng CSS */
    .track::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(25% - 1px), rgba(9, 11, 14, .65) calc(25% - 1px), rgba(9, 11, 14, .65) 25%);
    }
    .track > div { height: 100%; border-radius: 9999px; background: var(--info); transition: width .4s var(--ease-out), background .3s; }

    .kv { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 6px; }
    .kv b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; color: var(--txt); }

    /* ── goals — rows là <button> (a11y: Tab + Enter/Space copy) ── */
    .goals { margin-top: 2px; }
    .gline {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 0 -4px; width: calc(100% + 8px);
      border-radius: 6px; cursor: pointer; position: relative; background: transparent; border: 0; font: inherit; text-align: left;
      transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .gline:hover { background: var(--surface-hover); }
    .gline:active { transform: scale(0.992); }
    .gline .chk {
      width: 15px; height: 15px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: #052e23; background: var(--ok);
    }
    .gline .chk.failed { color: #2b0505; background: var(--bad); }
    .gline .chk.running { color: #082f49; background: var(--info); }
    .gline .chk.queued { color: #291a02; background: var(--warn); }
    .gline .gid { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--info); }
    .gline .task { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .gline .copied {
      position: absolute; right: 8px; top: -8px; font-size: 10px; color: var(--ok);
      background: var(--bg); border: 1px solid var(--ok-bd); border-radius: 9999px; padding: 1px 8px;
      opacity: 0; pointer-events: none; transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
      transform: translateX(4px);
    }
    .gline:hover .copied, .gline .copied.show { opacity: 1; transform: translateX(0); }
    .empty { color: var(--faint); font-size: 11px; padding: 4px 0; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    /* v1.9 (blueprint Gemini): empty state dạy trigger bằng hành động, không chỉ chữ */
    .code-copy {
      font-family: var(--mono); font-size: 10.5px; color: var(--ok); cursor: pointer;
      background: rgba(16, 185, 129, .08); border: 1px solid rgba(16, 185, 129, .35);
      border-radius: 4px; padding: 1px 6px;
    }
    .code-copy.is-copied { color: #052e23; background: var(--ok); }
    .empty-example { color: var(--faint); font-size: 10.5px; margin-top: 3px; }
    /* v1.9: goal đang chạy được pin lên banner ngay dưới tab bar */
    .goal-banner {
      display: flex; align-items: center; gap: 6px; margin: 0 14px 8px; padding: 6px 10px;
      border: 1px solid rgba(56, 189, 248, .35); background: rgba(56, 189, 248, .08);
      border-radius: 8px; font-size: 11px; color: var(--info);
    }
    .goal-banner .gid { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ── platforms — specular cards (spec: Linear/Raycast finish) ── */
    .prow {
      position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 0 -4px;
      border-radius: 8px; background: linear-gradient(180deg, rgba(255,255,255,.035) 0%, rgba(255,255,255,0) 100%), var(--surface-2);
      border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .11), 0 1px 2px rgba(0, 0, 0, .35);
      transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
    }
    .prow:hover { border-color: var(--line2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 4px 12px rgba(0, 0, 0, .45); }
    .picon {
      width: 28px; height: 28px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center;
      font: 700 8.5px var(--sans); letter-spacing: .3px; color: #07120f;
    }
    .picon.chatgpt { background: linear-gradient(135deg, #10a37f, #0d8a6b); color: #fff; }
    .picon.gemini { background: linear-gradient(135deg, #8ab4f8, #c58af9); color: #0b1a33; }
    .picon.claude { background: linear-gradient(135deg, #d97757, #c05a3a); color: #fff; }
    /* tab-not-open: icon xám, mờ — không đụng badge quota */
    .prow[data-live="0"] .picon { filter: grayscale(0.45); opacity: .75; }
    .pinfo { flex: 1; min-width: 0; }
    .pname { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
    .pdot { width: 6px; height: 6px; border-radius: 50%; background: #4b5563; }
    .pdot.live { background: var(--ok); box-shadow: 0 0 0 2px rgba(34, 197, 94, .25); }
    /* state matrix — spec bảng 4 trạng thái */
    .prow[data-budget="near"] { border-color: var(--warn-bd); }
    .prow[data-budget="near"] .pbar > div { background: var(--warn); }
    .prow[data-budget="blocked"], .prow[data-budget="cooldown"] {
      background: rgba(239, 68, 68, .07), var(--surface-2);
      border-color: var(--bad-bd);
    }
    .prow[data-budget="blocked"] .pname, .prow[data-budget="cooldown"] .pname,
    .prow[data-budget="blocked"] .picon, .prow[data-budget="cooldown"] .picon { opacity: .78; }
    .prow[data-budget="blocked"] .pbar > div, .prow[data-budget="cooldown"] .pbar > div { background: var(--bad); }
    .plabel { font-size: 10px; color: var(--faint); }
    .pbar { position: relative; height: 4px; background: var(--card2); border-radius: 9999px; overflow: hidden; margin: 5px 0 3px; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .6); }
    .pbar::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(25% - 1px), rgba(9, 11, 14, .65) calc(25% - 1px), rgba(9, 11, 14, .65) 25%);
    }
    .pbar > div { height: 100%; border-radius: 9999px; background: var(--info); transition: width .4s var(--ease-out), background .3s; }
    .pnum { font: 500 10.5px var(--mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; color: var(--faint); }
    .pbadge { font: 600 10px var(--mono); font-variant-numeric: tabular-nums; border-radius: 9999px; padding: 2px 8px; border: 1px solid var(--line); color: var(--dim); flex: none; }
    .pbadge.ok { color: var(--ok); border-color: var(--ok-bd); background: var(--ok-bg); }
    .pbadge.warn { color: var(--warn); border-color: var(--warn-bd); background: var(--warn-bg); }
    .pbadge.bad { color: var(--bad-text); border-color: var(--bad-bd); background: rgba(239, 68, 68, .2); }

    /* ── form (tab cài đặt) ──────────────── */
    label { display: block; font-size: 11px; font-weight: 600; color: var(--dim); margin: 10px 0 4px; }
    input[type="text"] {
      width: 100%; font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--txt);
      background: var(--card2); border: 1px solid var(--line2); border-radius: 6px; padding: 7px 9px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus { border-color: var(--ok); box-shadow: 0 0 0 2px rgba(16, 185, 129, .15); }
    .tokwrap { position: relative; }
    .tokwrap input { padding-right: 58px; }
    .tokwrap .ib {
      position: absolute; top: 50%; transform: translateY(-50%); width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center; background: transparent; border: 0;
      color: var(--dim); cursor: pointer; border-radius: 4px; font-size: 12px; padding: 0;
    }
    .tokwrap .ib:hover { color: var(--txt); background: rgba(255, 255, 255, 0.06); }
    .tokwrap #eye { right: 30px; } .tokwrap #paste { right: 6px; }

    .switchrow { display: flex; align-items: center; justify-content: space-between; margin: 11px 0 0; }
    .switchrow .lbl2 { font-size: 12px; }
    .sw { position: relative; width: 36px; height: 20px; flex: none; }
    .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
    .sw i {
      position: absolute; inset: 0; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--line2);
      border-radius: 9999px; transition: background .2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sw i::after {
      content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%;
      background: #94a3b8; transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sw input:checked + i { background: rgba(16, 185, 129, .25); border-color: var(--ok); }
    .sw input:checked + i::after { left: 18px; background: var(--ok); box-shadow: 0 0 6px rgba(16, 185, 129, .5); }

    /* ── CTA ─────────────────────────────── */
    .btns { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
    button.act { font: 600 12.5px var(--sans); padding: 8px 0; border-radius: 6px; cursor: pointer; transition: all .15s; }
    #save { background: var(--ok); color: #022c22; border: 1px solid var(--ok); }
    #save:hover { background: #0ea771; }
    #test {
      background: rgba(255, 255, 255, 0.05); color: var(--txt); border: 1px solid transparent; font-weight: 500;
    }
    #test:hover { background: rgba(255, 255, 255, 0.09); }
    #test.busy { color: var(--dim); pointer-events: none; }
    .spin { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--dim); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px; margin-right: 5px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { margin-top: 8px; font-size: 11px; min-height: 15px; color: var(--info); }

    /* ── a11y + motion (spec mục 6) ─────────── */
    :focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
    .goal-banner:not(.hidden) { animation: wgb-slide-down var(--dur-med) var(--ease-out); }
    @keyframes wgb-slide-down { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wordmark">wgb <em>companion</em></div>
    <div class="statuspill" id="server-status" title=""><span class="led" aria-hidden="true"></span><span id="statusText" class="mono">…</span></div>
  </div>

  <div class="tabs" role="tablist" aria-label="Chế độ xem">
    <button class="tab active" id="tab-monitor" role="tab" aria-selected="true" aria-controls="page-monitor" data-tab="monitor" tabindex="0">Giám sát</button>
    <button class="tab" id="tab-settings" role="tab" aria-selected="false" aria-controls="page-settings" data-tab="settings" tabindex="-1"><span class="gear">⚙</span>&nbsp;Cấu hình</button>
  </div>

  <div class="goal-banner hidden" id="goal-banner"></div>

  <div class="page" id="page-monitor">
    <div class="card">
      <div class="cardhead">
        <span class="ct">Nền tảng</span>
        <span class="ct" style="color:var(--faint)">mỗi app một hạn mức riêng</span>
      </div>
      <div id="platforms"><div class="empty">(đang tải…)</div></div>
    </div>

    <div class="card">
      <div class="cardhead">
        <span class="ct">Goals gần nhất</span>
        <span class="ct" id="goals-hint" style="color:var(--faint)">bấm dòng để copy ID</span>
      </div>
      <div class="goals" id="goals"><div class="empty">
        <div>chưa có goal — gõ <button type="button" class="code-copy" data-copy="@wgb status">@wgb &lt;task&gt;</button> trong chat</div>
        <div class="empty-example">Ví dụ: <code>@wgb tóm tắt diff git hiện tại</code></div>
      </div></div>
    </div>
  </div>

  <div class="page hidden" id="page-settings">
    <label>Server (wgb serve)</label>
    <input type="text" id="serverUrl" spellcheck="false" />
    <label>Token</label>
    <div class="tokwrap">
      <input type="password" id="token" spellcheck="false" autocomplete="off" />
      <button class="ib" id="eye" title="Ẩn/hiện token">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="ib" id="paste" title="Dán từ clipboard">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      </button>
    </div>
    <label>Trigger</label>
    <input type="text" id="trigger" spellcheck="false" />

    <div class="switchrow"><span class="lbl2">Bật content script</span><span class="sw"><input type="checkbox" id="enabled" /><i></i></span></div>
    <div class="switchrow"><span class="lbl2">Tự gửi kết quả vào chat</span><span class="sw"><input type="checkbox" id="autoSend" /><i></i></span></div>

    <div class="btns">
      <button id="save" class="act">Lưu cấu hình</button>
      <button id="test" class="act">Kiểm tra kết nối</button>
    </div>
    <div id="status"></div>
  </div>

  <span class="sr-only" aria-live="polite" id="wgb-announcer"></span>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
