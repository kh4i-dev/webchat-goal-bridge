<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #0a0e14; --panel: #0f141b; --line: #1e2a3a; --line2: #2a3a52;
      --txt: #c9d4e3; --dim: #5c7089; --ok: #22d3a5; --info: #38bdf8;
      --warn: #fbbf24; --bad: #f87171; --accent: #22d3a5;
    }
    * { box-sizing: border-box; }
    body {
      font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
      width: 360px; margin: 0; background: var(--bg); color: var(--txt);
      padding: 14px 14px 12px;
    }
    /* ── header ─────────────────────────────── */
    .hd { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line2); padding-bottom: 8px; }
    .hd .wordmark { font-weight: 700; letter-spacing: 1px; color: var(--accent); font-size: 13px; }
    .hd .wordmark .sep { color: var(--dim); }
    .hd .chip { font-size: 10px; color: var(--info); border: 1px solid var(--line2); padding: 0 6px; border-radius: 2px; }
    .tagline { color: var(--dim); font-size: 10.5px; margin: 6px 0 10px; letter-spacing: .3px; }
    /* ── sections ───────────────────────────── */
    .sec { border: 1px solid var(--line); background: var(--panel); padding: 8px 10px; margin-bottom: 8px; }
    .sec > .t { color: var(--dim); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
    .sec > .t::before { content: "▸ "; color: var(--accent); }
    .kv { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
    .kv .k { color: var(--dim); }
    .kv .v { text-align: right; }
    .ok { color: var(--ok); } .info { color: var(--info); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    .led { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; box-shadow: 0 0 6px var(--ok); animation: pulse 2s infinite; }
    .led.bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); animation: none; }
    @keyframes pulse { 50% { opacity: .55; } }
    /* ── bars ───────────────────────────────── */
    .barrow { margin: 5px 0 2px; }
    .barrow .lbl { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); }
    .track { height: 4px; background: #101827; border: 1px solid var(--line); margin-top: 3px; }
    .track > div { height: 100%; background: var(--info); }
    .track > div.hot { background: var(--bad); }
    /* ── goals log ──────────────────────────── */
    .log { font-size: 10.5px; }
    .log .ln { display: flex; gap: 6px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
    .log .ln:last-child { border-bottom: 0; }
    .log .st { min-width: 38px; }
    .log .st.done { color: var(--ok); } .log .st.failed { color: var(--bad); } .log .st.running { color: var(--info); } .log .st.queued { color: var(--warn); }
    .log .gid { color: var(--info); }
    .log .task { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .empty { color: var(--dim); font-size: 10.5px; padding: 2px 0; }
    /* ── form ───────────────────────────────── */
    label { display: block; color: var(--dim); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin: 9px 0 3px; }
    input[type="text"] {
      width: 100%; font: inherit; font-size: 11.5px; color: var(--txt);
      background: #0c1219; border: 1px solid var(--line2); padding: 6px 8px; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .switchrow { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 2px; }
    .switchrow .lbl2 { font-size: 11.5px; }
    .sw { position: relative; width: 34px; height: 16px; flex: none; }
    .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
    .sw i { position: absolute; inset: 0; background: #1a2433; border: 1px solid var(--line2); transition: .15s; }
    .sw i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; background: var(--dim); transition: .15s; }
    .sw input:checked + i { background: #0c2a22; border-color: var(--accent); }
    .sw input:checked + i::after { left: 19px; background: var(--accent); }
    /* ── buttons ────────────────────────────── */
    .btns { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1; font: inherit; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 7px 0; cursor: pointer; background: transparent; color: var(--accent);
      border: 1px solid var(--accent); border-radius: 2px;
    }
    button:hover { background: rgba(34, 211, 165, .08); }
    button.alt { color: var(--dim); border-color: var(--line2); }
    button.alt:hover { color: var(--txt); background: #121a24; }
    #status { margin-top: 8px; font-size: 10.5px; min-height: 15px; color: var(--info); white-space: pre-wrap; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--line2); }
  </style>
</head>
<body>
  <div class="hd">
    <span class="wordmark">WGB<span class="sep">//</span>COMPANION</span>
    <span class="chip" id="ver"></span>
  </div>
  <div class="tagline">chat web = não chỉ đạo · agent local = tay chân · 1 request / 1 tin</div>

  <div class="sec">
    <div class="t">Server</div>
    <div id="serverInfo"><span class="led bad"></span>đang kiểm tra…</div>
  </div>

  <div class="sec">
    <div class="t">Ngân sách giờ này</div>
    <div class="barrow"><div class="lbl"><span>record fetch</span><span id="bFetch">0/40</span></div><div class="track"><div id="barFetch"></div></div></div>
    <div class="barrow"><div class="lbl"><span>send</span><span id="bSend">0/40</span></div><div class="track"><div id="barSend"></div></div></div>
    <div class="kv" style="margin-top:5px"><span class="k">rate limit</span><span class="v ok" id="limitInfo">OK</span></div>
  </div>

  <div class="sec">
    <div class="t">Goals gần nhất</div>
    <div class="log" id="goals"><div class="empty">(đang tải…)</div></div>
  </div>

  <label>server (wgb serve)</label>
  <input type="text" id="serverUrl" spellcheck="false" />
  <label>token</label>
  <input type="text" id="token" spellcheck="false" />
  <label>trigger</label>
  <input type="text" id="trigger" spellcheck="false" />

  <div class="switchrow"><span class="lbl2">Bật content script</span><span class="sw"><input type="checkbox" id="enabled" /><i></i></span></div>
  <div class="switchrow"><span class="lbl2">Tự gửi kết quả vào chat</span><span class="sw"><input type="checkbox" id="autoSend" /><i></i></span></div>

  <div class="btns">
    <button id="save">Lưu cấu hình</button>
    <button id="test" class="alt">Kiểm tra</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
